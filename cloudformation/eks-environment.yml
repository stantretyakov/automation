AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deploy full EKS environment using nested stacks for VPC, EKS, S3 and RDS
Parameters:
  EnvironmentName:
    Type: String
    Description: Name prefix for created resources
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
  ClusterName:
    Type: String
    Default: eks-cluster
  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeGroupDesiredSize:
    Type: Number
    Default: 2
  NodeGroupMaxSize:
    Type: Number
    Default: 3
  NodeGroupMinSize:
    Type: Number
    Default: 1
  S3BucketName:
    Type: String
  DBName:
    Type: String
    Default: platform
  DBUser:
    Type: String
    Default: dbuser
  DBPassword:
    Type: String
    NoEcho: true
  DBPort:
    Type: Number
    Default: 5432
Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/vpc.yml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
  EKSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: templates/eks.yml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !Ref ClusterName
        NodeInstanceType: !Ref NodeInstanceType
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize
        NodeGroupMinSize: !Ref NodeGroupMinSize
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnet1Id: !GetAtt VPCStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt VPCStack.Outputs.PrivateSubnet2Id
  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/s3.yml
      Parameters:
        S3BucketName: !Ref S3BucketName
  RDSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: EKSStack
    Properties:
      TemplateURL: templates/rds.yml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DBName: !Ref DBName
        DBUser: !Ref DBUser
        DBPassword: !Ref DBPassword
        DBPort: !Ref DBPort
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnet1Id: !GetAtt VPCStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt VPCStack.Outputs.PrivateSubnet2Id
        EksSecurityGroupId: !GetAtt EKSStack.Outputs.ClusterSecurityGroupId
Outputs:
  ClusterName:
    Value: !GetAtt EKSStack.Outputs.ClusterName
  S3Bucket:
    Value: !GetAtt S3Stack.Outputs.S3Bucket
  RDSInstance:
    Value: !GetAtt RDSStack.Outputs.RDSInstance
  VpcId:
    Value: !GetAtt VPCStack.Outputs.VpcId
